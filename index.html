    <!--
      Robust iOS Keyboard Fix using Visual Viewport API
      This script addresses a notorious bug in iOS Safari where fixed-position elements (like a bottom navbar)
      get stuck in the middle of the screen after the on-screen keyboard is dismissed. This robust solution
      uses the `visualViewport` API to track the keyboard state and force a repaint on the navbar when the
      keyboard is dismissed, resolving the rendering glitch.

    -->
    <script>
      (function() {
        // Run this fix only on iOS devices to avoid unintended side effects on other platforms.
        if (!/iPad|iPhone|iPod/.test(navigator.userAgent) || window.MSStream) {
          return;
        }

        // This fix relies on the Visual Viewport API, which is the most reliable way to
        // detect changes in the visible area of the screen, like when the keyboard appears.
        if (!window.visualViewport) {
          return;
        }

        const installIosKeyboardFix = () => {
                    const footer = document.querySelector('#bottom-nav-bar');
          if (!footer) {
            return;
          }
          
          // Heuristic to check if the keyboard is open. It's open if the visual viewport
          // is significantly smaller than the layout viewport. We use a threshold (e.g., 90%)
          // to account for small differences or browser chrome.
          const isKeyboardOpen = () => window.visualViewport.height < window.innerHeight * 0.9;
          
          let keyboardWasOpen = isKeyboardOpen();

          window.visualViewport.addEventListener('resize', () => {
            const keyboardIsOpenNow = isKeyboardOpen();

            
                       // The repaint logic should trigger only on the transition from open to closed.
            if (keyboardWasOpen && !keyboardIsOpenNow) {
              // The bug causes the `fixed` element to be stuck. By briefly changing its `position`,
              // we force Safari to recalculate its layout from scratch when we set it back.
              footer.style.position = 'absolute'; // Temporarily break the 'fixed' layout context.
              
              // Using requestAnimationFrame ensures our change back to 'fixed' happens
              // right before the next browser repaint, making the fix smooth and efficient.
              requestAnimationFrame(() => {
                footer.style.position = 'fixed'; // Restore the correct positioning.
              });
            }
            
            keyboardWasOpen = keyboardIsOpenNow;
          });

        };

        // Wait until the DOM is fully loaded to ensure the nav bar element is available to be selected.
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installIosKeyboardFix);
        } else {
          // DOM is already ready.
          installIosKeyboardFix();
        }
      })();
    </script>
