<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Your Dream Trip with AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9fa; /* A very light off-white */
        background-image:
          radial-gradient(at 0% 0%, hsla(210, 80%, 90%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 100%, hsla(300, 80%, 95%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(340, 80%, 90%, 0.3) 0px, transparent 50%);
        background-attachment: fixed;
      }
      .pdf-export-render {
        position: fixed !important;
        left: 0;
        top: 0;
        z-index: -1; /* Behind everything */
        opacity: 0; /* Fully transparent */
        pointer-events: none; /* Not interactive */
        width: 8.5in; /* Standard letter width for layout calculation */
        background: white !important; /* Ensure background is not transparent */
      }
      @media print {
        body {
          background: white !important;
          margin: 0;
          padding: 0;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .printable-container {
          display: block !important;
          padding: 0;
          margin: 0;
          box-shadow: none !important;
          border: none !important;
        }
        .guidebook-page {
            page-break-before: always;
            break-before: page;
            padding-top: 2rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .cover-page, .toc-page {
            page-break-before: avoid !important;
            break-before: auto !important;
            height: 100vh;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .cover-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
        }
        .cover-subtitle {
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .cover-title {
            font-size: 4rem;
            font-weight: 800;
            margin: 1rem 0;
            line-height: 1.1;
        }
        .cover-footer {
            font-size: 1rem;
            margin-top: 4rem;
            opacity: 0.8;
        }
        .toc-page {
            page-break-after: always !important;
        }
        .toc-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 0.5rem;
        }
        .toc-list {
            list-style: none;
            padding: 0;
            display: inline-block;
            text-align: left;
        }
        .toc-list li {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .toc-list a {
            text-decoration: none;
            color: #6366f1;
            font-weight: 500;
        }
        #guidebook-content .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        h1, h2, h3, h4 {
            break-after: avoid;
        }
        
        /* Disable all animations during printing to prevent faded/blank pages */
        .animated-card,
        .fade-in,
        .slide-down-animation,
        .auth-modal-enter,
        .auth-modal-content-enter,
        .user-profile-dropdown-enter {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        
        /* Ensure all content is visible immediately during print */
        * {
            animation: none !important;
            transition: none !important;
        }
        
        /* Force all animated elements to be fully visible */
        .animated-card {
            opacity: 1 !important;
            transform: none !important;
        }

        /* Lingo Guide Accordion Print Fix */
        .printable-accordion-content {
            max-height: none !important;
            opacity: 1 !important;
            overflow: visible !important;
            display: block !important;
            grid-template-rows: 1fr !important;
        }
        .printable-accordion-toggle-icon {
            display: none !important;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animated-card {
        animation: card-enter 0.6s ease-out;
        animation-fill-mode: backwards;
      }
      
      .progress-bar-indeterminate {
        width: 40%;
        animation: indeterminate-animation 1.5s ease-in-out infinite;
      }
      @keyframes indeterminate-animation {
        0% { transform: translateX(-75%); }
        100% { transform: translateX(250%); }
      }
      @keyframes fun-fact-fade-in {
          0% { opacity: 0; transform: translateY(8px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes validation-fade-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      @keyframes progress-bar-fill {
        from { width: 0%; }
        to { width: 100%; }
      }
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-down-animation {
        animation: slideDown 0.3s ease-out;
      }
      
      /* Minimal iOS datepicker fix - only affects date inputs */
      @supports (-webkit-touch-callout: none) {
        input[type="date"] {
          /* Prevent iOS zoom on focus */
          font-size: 16px !important;
          /* Ensure proper touch target */
          min-height: 44px !important;
          /* Prevent iOS from applying default styles */
          -webkit-appearance: none;
          appearance: none;
          /* Ensure consistent rendering */
          border-radius: 8px;
          padding: 12px 16px;
        }
      }
    </style>

  <body class="text-gray-800">

    <!--
      Robust iOS Keyboard Fix using Visual Viewport API
      This script addresses a notorious bug in iOS Safari where fixed-position elements (like a bottom navbar)
      get stuck in the middle of the screen after the on-screen keyboard is dismissed. This robust solution
      uses the `visualViewport` API to track the keyboard state and force a repaint on the navbar when the
      keyboard is dismissed, resolving the rendering glitch.
    -->
    <script>
      (function() {
        // Run this fix only on iOS devices.
        if (!/iPad|iPhone|iPod/.test(navigator.userAgent) || window.MSStream) {
          return;
        }

        // The Visual Viewport API is the most reliable way to detect keyboard changes.
        if (!window.visualViewport) {
          return;
        }

        const installIosKeyboardFix = () => {
          const footer = document.querySelector('.sm\\:hidden.fixed.bottom-0');
          if (!footer) {
            return;
          }
          
          // Heuristic to check if the keyboard is open. It's open if the visual viewport
          // is significantly smaller than the layout viewport. We use a threshold (e.g., 90%)
          // to account for small differences or browser chrome.
          const isKeyboardOpen = () => window.visualViewport.height < window.innerHeight * 0.9;
          
          let keyboardWasOpen = isKeyboardOpen();

          window.visualViewport.addEventListener('resize', () => {
            const keyboardIsOpenNow = isKeyboardOpen();
            
            // The repaint logic should trigger only on the transition from open to closed.
            if (keyboardWasOpen && !keyboardIsOpenNow) {
              // The bug causes the `fixed` element to be stuck. By briefly changing its `position`,
              // we force Safari to recalculate its layout from scratch when we set it back.
              footer.style.position = 'absolute'; // Temporarily break the 'fixed' layout context.
              
              // Using requestAnimationFrame ensures our change back to 'fixed' happens
              // right before the next browser repaint, making the fix smooth and efficient.
              requestAnimationFrame(() => {
                footer.style.position = 'fixed'; // Restore the correct positioning.
              });
            }
            
            keyboardWasOpen = keyboardIsOpenNow;
          });
        };

        // Wait until the initial DOM is loaded to ensure the footer element exists.
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installIosKeyboardFix);
        } else {
          // DOM is already ready.
          installIosKeyboardFix();
        }
      })();
    </script>
