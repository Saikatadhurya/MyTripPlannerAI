        /* Disable all animations during printing to prevent faded/blank pages */
        .animated-card,
        .fade-in,
        .slide-down-animation,
        .auth-modal-enter,
        .auth-modal-content-enter,
        .user-profile-dropdown-enter {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        
        /* Ensure all content is visible immediately during print */
        * {
            animation: none !important;
            transition: none !important;
        }
        
        /* Force all animated elements to be fully visible */
        .animated-card {
            opacity: 1 !important;
            transform: none !important;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animated-card {
        animation: card-enter 0.6s ease-out;
        animation-fill-mode: backwards;
      }
      
      .progress-bar-indeterminate {
        width: 40%;
        animation: indeterminate-animation 1.5s ease-in-out infinite;
      }
      @keyframes indeterminate-animation {
        0% { transform: translateX(-75%); }
        100% { transform: translateX(250%); }
      }
      @keyframes fun-fact-fade-in {
          0% { opacity: 0; transform: translateY(8px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes validation-fade-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      @keyframes progress-bar-fill {
        from { width: 0%; }
        to { width: 100%; }
      }
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-down-animation {
        animation: slideDown 0.3s ease-out;
      }
      /* Custom animations for auth modal */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .auth-modal-enter {
        animation: fadeIn 0.3s ease-out;
      }

      .auth-modal-content-enter {
        animation: slideDown 0.3s ease-out;
      }

      .user-profile-dropdown-enter {
        animation: slideUp 0.2s ease-out;
      }

      /* Slide down animation for header */
      @keyframes slideDownAnimation {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .slide-down-animation {
        animation: slideDownAnimation 0.3s ease-out;
      }

      /* Animated cards */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animated-card {
        animation: fadeInUp 0.6s ease-out forwards;
        opacity: 0;
      }

      /* Loading spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }

             .animate-spin {
         animation: spin 1s linear infinite;

               /* iOS-specific fixes for date inputs and viewport issues */
        @supports (-webkit-touch-callout: none) {
          /* iOS Safari specific styles */
          input[type="date"] {
            /* Prevent iOS from zooming in on focus */
            font-size: 16px !important;
            /* Ensure proper touch target size */
            min-height: 44px !important;
            /* Prevent iOS from applying default styles */
            -webkit-appearance: none;
            appearance: none;
            /* Ensure consistent rendering */
            border-radius: 8px;
            padding: 12px 16px;
          }
          
          /* Fix for iOS viewport shifting when date picker opens */
          body {
            /* Prevent iOS Safari from adjusting viewport */
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            /* Prevent iOS from changing viewport dimensions */
            -webkit-overflow-scrolling: touch;
            overflow-scrolling: touch;
          }
          
          /* Ensure forms stay in view on iOS */
          form {
            /* Prevent iOS from shifting the form */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            /* Ensure proper stacking context */
            position: relative;
            z-index: 1;
          }
          
          /* Fix for iOS input focus issues */
          input:focus,
          select:focus,
          textarea:focus {
            /* Prevent iOS from zooming and shifting */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            /* Ensure focus state is visible */
            outline: none;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
          }
          
          /* Specific fix for date inputs on iOS */
          input[type="date"]:focus {
            /* Prevent iOS Safari from adjusting the viewport */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            /* Ensure the input stays in view */
            position: relative;
            z-index: 10;
          }
          
          /* Fix for iOS Safari date picker overlay */
          input[type="date"]::-webkit-calendar-picker-indicator {
            /* Ensure the date picker icon is properly sized */
            width: 20px;
            height: 20px;
            /* Prevent iOS from applying default styles */
            -webkit-appearance: none;
            appearance: none;
          }
        }
       
               /* Additional mobile viewport fixes */

          /* Prevent horizontal scrolling on mobile */
          body {
            overflow-x: hidden;
            /* Ensure proper mobile viewport handling */
            position: relative;
            width: 100%;
          }
          
          /* Ensure form inputs don't overflow on mobile */
          input[type="date"],
          input[type="text"],
          select,
          textarea {
            max-width: 100%;
            box-sizing: border-box;
            /* Prevent iOS from applying default mobile styles */
            -webkit-appearance: none;
            appearance: none;
          }
          
          /* Fix for mobile date picker viewport issues */
          .date-input-container {
            position: relative;
            z-index: 1;
          }
          
          /* Specific mobile date input fixes */

            /* Ensure proper mobile rendering */

            transform: translateZ(0);
            /* Prevent iOS Safari viewport issues */
            position: relative;
            z-index: 5;
          }
          
          /* Fix for mobile form containers */
          form {
            /* Ensure forms don't shift on mobile */
            position: relative;
            z-index: 1;
            /* Prevent iOS from adjusting layout */
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
          }
        }
        
        /* Additional iOS Safari specific fixes */
        @supports (-webkit-touch-callout: none) and (max-width: 768px) {
          /* iOS mobile specific overrides */
          input[type="date"] {
            /* Force iOS Safari to maintain viewport */

            transform: translateZ(0) !important;

           <!-- iOS-specific viewport fixes -->
      <script>
        // Fix for iOS Safari viewport issues with date inputs
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
          // Store original viewport settings
          let originalViewport = document.querySelector('meta[name="viewport"]').getAttribute('content');
          let isDatePickerOpen = false;
          
          document.addEventListener('DOMContentLoaded', function() {
            // Fix viewport on date input focus
            const dateInputs = document.querySelectorAll('input[type="date"]');
            dateInputs.forEach(input => {
              input.addEventListener('focus', function() {
                isDatePickerOpen = true;
                // Temporarily disable viewport restrictions to prevent iOS zoom
                document.querySelector('meta[name="viewport"]').setAttribute('content', 
                  'width=device-width, initial-scale=1.0, user-scalable=yes');
                
                // Scroll the input into view smoothly
                setTimeout(() => {
                  input.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center',
                    inline: 'nearest'
                  });
                }, 300);
              });
              
              input.addEventListener('blur', function() {
                isDatePickerOpen = false;
                // Restore original viewport settings
                setTimeout(() => {
                  document.querySelector('meta[name="viewport"]').setAttribute('content', originalViewport);
                }, 100);
              });
            });
            
            // Handle iOS Safari viewport issues more gracefully
            let initialViewportHeight = window.innerHeight;
            let initialViewportWidth = window.innerWidth;
            
            // Monitor viewport changes
            window.addEventListener('resize', function() {
              if (isDatePickerOpen) {
                // If viewport changed while date picker is open, adjust scroll
                const currentHeight = window.innerHeight;
                const currentWidth = window.innerWidth;
                
                if (currentHeight !== initialViewportHeight || currentWidth !== initialViewportWidth) {
                  // Viewport changed, scroll to keep form visible
                  setTimeout(() => {
                    const activeElement = document.activeElement;
                    if (activeElement && activeElement.type === 'date') {
                      activeElement.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center',
                        inline: 'nearest'
                      });
                    }
                  }, 100);
                }
              }
            });
            
            // Prevent iOS Safari from adjusting viewport on orientation change
            window.addEventListener('orientationchange', function() {
              if (isDatePickerOpen) {
                // Wait for orientation change to complete
                setTimeout(() => {
                  const activeElement = document.activeElement;
                  if (activeElement && activeElement.type === 'date') {
                    activeElement.scrollIntoView({ 
                      behavior: 'smooth', 
                      block: 'center',
                      inline: 'nearest'
                    });
                  }
                }, 500);
              }
            });
            
            // Handle virtual keyboard appearance
            if ('visualViewport' in window) {
              window.visualViewport.addEventListener('resize', function() {
                if (isDatePickerOpen) {
                  setTimeout(() => {
                    const activeElement = document.activeElement;
                    if (activeElement && activeElement.type === 'date') {
                      activeElement.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center',
                        inline: 'nearest'
                      });
                    }
                  }, 100);
                }
              });
            }
          });
        }
      </script>
