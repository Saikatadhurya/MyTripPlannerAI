<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Your Dream Trip with AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f2f5;
        background-image:
          radial-gradient(at 10% 20%, hsla(212,89%,74%,0.2) 0px, transparent 50%),
          radial-gradient(at 80% 10%, hsla(28,96%,76%,0.2) 0px, transparent 50%),
          radial-gradient(at 70% 80%, hsla(340,86%,76%,0.2) 0px, transparent 50%),
          radial-gradient(at 20% 90%, hsla(240,84%,79%,0.2) 0px, transparent 50%);
        background-attachment: fixed;
      }
      @media print {
        body {
          background: white !important;
        }
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        display: none;
        -webkit-appearance: none;
      }
    </style>
