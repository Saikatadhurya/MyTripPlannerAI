<!DOCTYPE html>
<html lang="en">
  <head>
         <meta charset="UTF-8" />
     <link rel="icon" type="image/svg+xml" href="/vite.svg" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PLANORA - AI Travel Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9fa; /* A very light off-white */
        background-image:
          radial-gradient(at 0% 0%, hsla(210, 80%, 90%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 100%, hsla(300, 80%, 95%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(340, 80%, 90%, 0.3) 0px, transparent 50%);
        background-attachment: fixed;
      }
      .pdf-export-render {
        position: fixed !important;
        left: 0;
        top: 0;
        z-index: -1; /* Behind everything */
        opacity: 0; /* Fully transparent */
        pointer-events: none; /* Not interactive */
        width: 8.5in; /* Standard letter width for layout calculation */
        background: white !important; /* Ensure background is not transparent */
      }
      @media print {
        body {
          background: white !important;
          margin: 0;
          padding: 0;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .printable-container {
          display: block !important;
          padding: 0;
          margin: 0;
          box-shadow: none !important;
          border: none !important;
        }
        .guidebook-page {
            page-break-before: always;
            break-before: page;
            padding-top: 2rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .cover-page, .toc-page {
            page-break-before: avoid !important;
            break-before: auto !important;
            height: 100vh;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .cover-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
        }
        .cover-subtitle {
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .cover-title {
            font-size: 4rem;
            font-weight: 800;
            margin: 1rem 0;
            line-height: 1.1;
        }
        .cover-footer {
            font-size: 1rem;
            margin-top: 4rem;
            opacity: 0.8;
        }
        .toc-page {
            page-break-after: always !important;
        }
        .toc-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 0.5rem;
        }
        .toc-list {
            list-style: none;
            padding: 0;
            display: inline-block;
            text-align: left;
        }
        .toc-list li {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .toc-list a {
            text-decoration: none;
            color: #6366f1;
            font-weight: 500;
        }
        #guidebook-content .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        h1, h2, h3, h4 {
            break-after: avoid;
        }
        
        /* Disable all animations during printing to prevent faded/blank pages */
        .animated-card,
        .fade-in,
        .slide-down-animation,
        .auth-modal-enter,
        .auth-modal-content-enter,
        .user-profile-dropdown-enter {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        
        /* Ensure all content is visible immediately during print */
        * {
            animation: none !important;
            transition: none !important;
        }
        
        /* Force all animated elements to be fully visible */
        .animated-card {
            opacity: 1 !important;
            transform: none !important;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animated-card {
        animation: card-enter 0.6s ease-out;
        animation-fill-mode: backwards;
      }
      
      .progress-bar-indeterminate {
        width: 40%;
        animation: indeterminate-animation 1.5s ease-in-out infinite;
      }
      @keyframes indeterminate-animation {
        0% { transform: translateX(-75%); }
        100% { transform: translateX(250%); }
      }
      @keyframes fun-fact-fade-in {
          0% { opacity: 0; transform: translateY(8px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes validation-fade-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      @keyframes progress-bar-fill {
        from { width: 0%; }
        to { width: 100%; }
      }
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-down-animation {
        animation: slideDown 0.3s ease-out;
      }
      /* Custom animations for auth modal */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .auth-modal-enter {
        animation: fadeIn 0.3s ease-out;
      }

      .auth-modal-content-enter {
        animation: slideDown 0.3s ease-out;
      }

      .user-profile-dropdown-enter {
        animation: slideUp 0.2s ease-out;
      }

      /* Slide down animation for header */
      @keyframes slideDownAnimation {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .slide-down-animation {
        animation: slideDownAnimation 0.3s ease-out;
      }

      /* Animated cards */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animated-card {
        animation: fadeInUp 0.6s ease-out forwards;
        opacity: 0;
      }

      /* Loading spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

             .animate-spin {
         animation: spin 1s linear infinite;
       }
       
       /* iOS-specific fixes for date inputs and viewport issues */
       @supports (-webkit-touch-callout: none) {
         /* iOS Safari specific styles */
         input[type="date"] {
           /* Prevent iOS from zooming in on focus */
           font-size: 16px !important;
         }
         
         /* Fix for iOS viewport shifting when date picker opens */
         body {
           /* Prevent iOS Safari from adjusting viewport */
           -webkit-text-size-adjust: 100%;
           -ms-text-size-adjust: 100%;
           text-size-adjust: 100%;
         }
         
         /* Ensure forms stay in view on iOS */
         form {
           /* Prevent iOS from shifting the form */
           transform: translateZ(0);
           -webkit-transform: translateZ(0);
         }
         
         /* Fix for iOS input focus issues */
         input:focus,
         select:focus,
         textarea:focus {
           /* Prevent iOS from zooming and shifting */
           transform: translateZ(0);
           -webkit-transform: translateZ(0);
         }
       }
       
       /* Additional mobile viewport fixes */
       @media screen and (max-width: 768px) {
         /* Prevent horizontal scrolling on mobile */
         body {
           overflow-x: hidden;
         }
         
         /* Ensure form inputs don't overflow on mobile */
         input[type="date"],
         input[type="text"],
         select,
         textarea {
           max-width: 100%;
           box-sizing: border-box;
         }
         
         /* Fix for mobile date picker viewport issues */
         .date-input-container {
           position: relative;
           z-index: 1;
         }
       }
     </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-dom/server": "https://aistudiocdn.com/react-dom@^19.1.1/server",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0"
  }
}
</script>
</head>
  <body class="text-gray-800">
    <div id="root"></div>
         <script type="module" src="/index.tsx"></script>
     
     <!-- iOS-specific viewport fixes -->
     <script>
       // Fix for iOS Safari viewport issues with date inputs
       if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
         // Prevent iOS from adjusting viewport when date picker opens
         document.addEventListener('DOMContentLoaded', function() {
           // Fix viewport on date input focus
           const dateInputs = document.querySelectorAll('input[type="date"]');
           dateInputs.forEach(input => {
             input.addEventListener('focus', function() {
               // Prevent iOS from zooming and shifting viewport
               setTimeout(() => {
                 window.scrollTo(0, 0);
               }, 100);
             });
             
             input.addEventListener('blur', function() {
               // Restore viewport after date picker closes
               setTimeout(() => {
                 window.scrollTo(0, 0);
               }, 100);
             });
           });
           
           // Prevent iOS Safari from adjusting viewport on orientation change
           window.addEventListener('orientationchange', function() {
             setTimeout(() => {
               window.scrollTo(0, 0);
             }, 100);
           });
         });
       }
     </script>
   </body>
</html>
