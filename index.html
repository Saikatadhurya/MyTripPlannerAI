
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Your Dream Trip with AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9fa; /* A very light off-white */
        background-image:
          radial-gradient(at 0% 0%, hsla(210, 80%, 90%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 100%, hsla(300, 80%, 95%, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(340, 80%, 90%, 0.3) 0px, transparent 50%);
        background-attachment: fixed;
      }
      @media print {
        body {
          background: white !important;
          margin: 0;
          padding: 0;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .printable-container {
          display: block !important;
          padding: 0;
          margin: 0;
          box-shadow: none !important;
          border: none !important;
        }
        .guidebook-page {
            page-break-before: always;
            break-before: page;
            padding-top: 2rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .cover-page, .toc-page {
            page-break-before: avoid !important;
            break-before: auto !important;
            height: 100vh;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .cover-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
        }
        .cover-subtitle {
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .cover-title {
            font-size: 4rem;
            font-weight: 800;
            margin: 1rem 0;
            line-height: 1.1;
        }
        .cover-footer {
            font-size: 1rem;
            margin-top: 4rem;
            opacity: 0.8;
        }
        .toc-page {
            page-break-after: always !important;
        }
        .toc-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 0.5rem;
        }
        .toc-list {
            list-style: none;
            padding: 0;
            display: inline-block;
            text-align: left;
        }
        .toc-list li {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .toc-list a {
            text-decoration: none;
            color: #6366f1;
            font-weight: 500;
        }
        #guidebook-content .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        h1, h2, h3, h4 {
            break-after: avoid;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animated-card {
        animation: card-enter 0.6s ease-out;
        animation-fill-mode: backwards;
      }
      
      .progress-bar-indeterminate {
        width: 40%;
        animation: indeterminate-animation 1.5s ease-in-out infinite;
      }
      @keyframes indeterminate-animation {
        0% { transform: translateX(-75%); }
        100% { transform: translateX(250%); }
      }
      @keyframes fun-fact-fade-in {
          0% { opacity: 0; transform: translateY(8px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes validation-fade-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      @keyframes progress-bar-fill {
        from { width: 0%; }
        to { width: 100%; }
      }
      @keyframes slideDown {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-down-animation {
        animation: slideDown 0.3s ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0"
  }
}
</script>
</head>
  <body class="text-gray-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
