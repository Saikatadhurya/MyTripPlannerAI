<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Your Dream Trip with AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f2f5;
        background-image:
          radial-gradient(at 10% 20%, hsla(212,89%,74%,0.3) 0px, transparent 50%),
          radial-gradient(at 80% 10%, hsla(28,96%,76%,0.3) 0px, transparent 50%),
          radial-gradient(at 70% 80%, hsla(340,86%,76%,0.3) 0px, transparent 50%),
          radial-gradient(at 20% 90%, hsla(240,84%,79%,0.3) 0px, transparent 50%);
        background-attachment: fixed;
      }
      @media print {
        body {
          background: white !important;
        }
        .no-print {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animated-card {
        animation: card-enter 0.6s ease-out;
        animation-fill-mode: backwards;
      }
      
      .progress-bar-indeterminate {
        width: 40%;
        animation: indeterminate-animation 1.5s ease-in-out infinite;
      }
      @keyframes indeterminate-animation {
        0% { transform: translateX(-75%); }
        100% { transform: translateX(250%); }
      }
      @keyframes fun-fact-fade-in {
          0% { opacity: 0; transform: translateY(8px); }
          20% { opacity: 1; transform: translateY(0); }
          80% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
